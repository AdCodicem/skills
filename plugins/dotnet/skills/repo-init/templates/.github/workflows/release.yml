name: Release

# Runs only after CI has passed on main — never releases from an unverified build.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write # semantic-release commits CHANGELOG.md and creates tags/releases
  issues: write
  pull-requests: write
  id-token: write # required to request the OIDC token for NuGet trusted publishing

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # semantic-release needs full history to compute the next version

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted publishing: exchange the GitHub OIDC token for a short-lived
      # NuGet.org API key. Requires the trusted publisher to be registered
      # on nuget.org first (see SKILL.md §6 — this is a manual one-time step).
      - name: NuGet login (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: "{{nuget-username}}"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          npx --yes \
            -p semantic-release \
            -p @semantic-release/changelog \
            -p @semantic-release/exec \
            -p @semantic-release/git \
            -p @semantic-release/github \
            -p @semantic-release/commit-analyzer \
            -p @semantic-release/release-notes-generator \
            semantic-release
