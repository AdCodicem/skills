name: Benchmarks

# Manual only: BenchmarkDotNet needs a quiet, dedicated runner to produce
# trustworthy numbers, and running it on every push would be slow and noisy
# for no benefit on a shared CI runner. Trigger it deliberately before a
# release or when investigating a perf change.
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Replace with the actual path to your *.Benchmarks.csproj — see benchmarks/README.md
      - name: Run benchmarks
        run: dotnet run --configuration Release --project benchmarks/{{ProjectName}}.Benchmarks -- --filter '*'

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/results/
