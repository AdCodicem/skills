name: Stale

on:
  schedule:
    - cron: "30 1 * * *" # daily

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          exempt-issue-labels: "pinned,security"
          exempt-pr-labels: "pinned"
          stale-issue-message: >
            This issue has had no activity for 60 days and will be closed in
            14 days if nothing changes. Comment to keep it open.
          stale-pr-message: >
            This pull request has had no activity for 60 days and will be
            closed in 14 days if nothing changes.
