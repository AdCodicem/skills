# Fragment: steps for the `pack` job of release.yml and preview.yml, after the
# checkout. No credential is available here, and none is needed.
#
# Inputs (job environment, set by the core workflow):
#   VERSION       the version to stamp: 1.4.0, or 1.4.0-preview.37 for a preview
# Output: dist/npm/*.tgz, one tarball per published package
#
# A pnpm workspace with several published packages: stamp and pack each one
# (pnpm --filter "<name>" exec npm version ..., pnpm --filter "<name>" pack ...).
steps:
  - uses: pnpm/action-setup@v6

  - uses: actions/setup-node@v7
    with:
      node-version-file: .nvmrc
      # npm's guidance for release builds: never restore a cache.
      package-manager-cache: false

  - name: Install
    run: pnpm install --frozen-lockfile

  # The version lives in tags only: package.json keeps 0.0.0-managed-by-semantic-release
  # in git, and the tarball gets the release's version.
  - name: Stamp the version
    run: npm version "$VERSION" --no-git-tag-version --allow-same-version

  - name: Build
    run: pnpm run build

  - name: Check the package
    run: pnpm run check:package

  - name: Pack
    run: pnpm pack --pack-destination dist/npm

  - name: List the packages
    run: ls -l dist/npm
