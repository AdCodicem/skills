name: Feature request
description: Suggest a change or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would solve it? Alternatives you considered are welcome.
  - type: dropdown
    id: contribution
    attributes:
      label: Would you open a pull request?
      options:
        - "Yes"
        - "With guidance"
        - "No"
