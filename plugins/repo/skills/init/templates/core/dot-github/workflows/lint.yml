name: lint

# Kept apart from ci.yml because it must also run when a pull request title is
# edited, which would otherwise rerun every build. The ruleset on main requires
# `pr-title`, `workflows` and `pre-commit`: renaming a job means updating it.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # The title becomes the squash commit, and the squash commit decides the
      # next version: it must be a Conventional Commit.
      - if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            build
            ci
            chore
            docs
            refactor
            revert
            style
            test

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # renovate: datasource=github-releases depName=rhysd/actionlint
      ACTIONLINT_VERSION: 1.7.12
      # renovate: datasource=github-releases depName=github/gh-actions-lock
      ACTIONS_LOCK_VERSION: v0.5.1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "$base/$archive"
          curl -fsSL "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt" | grep " $archive\$" | sha256sum --check
          tar -xzf "$archive" actionlint
          ./actionlint -color

      - name: zizmor
        uses: zizmorcore/zizmor-action@v0
        with:
          advanced-security: false
          persona: regular

      - name: Workflow lockfile is current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin "$ACTIONS_LOCK_VERSION"
          gh actions-lock --verify

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # renovate: datasource=pypi depName=pre-commit
      PRE_COMMIT_VERSION: 4.7.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      # Not pre-commit/action: it is a composite action that calls actions/cache
      # by tag, which the "require actions pinned to a full-length commit SHA"
      # policy refuses. The same steps, with every action pinned here.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install "pre-commit==${PRE_COMMIT_VERSION}"
      - run: pre-commit run --all-files --show-diff-on-failure --color=always
