name: dependency bots

# Merges non-major dependency updates without a person, once `gate` is green.
# Renovate merges its own pull requests (platform auto-merge); this workflow
# queues auto-merge for Dependabot's action updates and, for team profiles,
# approves the non-major pull requests of both bots.
#
# On `pull_request`, never `pull_request_target` (blocked by default in public
# repositories since 2026-12-02): a Dependabot-triggered run gets a read-only
# token, which the job-level permissions below raise. The guards keep every
# step to the bots' own branches of this repository, and nothing here checks
# out or runs code from the pull request.
on:
  pull_request:
    types: [opened, reopened, labeled]

permissions: {}

jobs:
  dependabot:
    name: queue Dependabot auto-merge
    # The pull request's author, not github.actor, which zizmor rightly calls
    # spoofable; fetch-metadata then checks that Dependabot signed every commit.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Refuses a pull request carrying any commit Dependabot did not sign.
      - uses: dependabot/fetch-metadata@v3
        id: metadata
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Team profiles only (one required approval): delete for solo profiles.
      - name: Approve
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Auto-merge waits for the checks the ruleset requires, then squashes
      # under the pull request title. A major, or an update fetch-metadata
      # cannot classify, is left to a person.
      - name: Queue auto-merge
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Team profiles only: delete this job for solo profiles. Renovate labels the
  # updates its preset auto-merges with `automerge`; approving them lets its
  # platform auto-merge proceed.
  renovate:
    name: approve Renovate update
    if: >-
      github.event.pull_request.user.login == '{{renovate-bot}}[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Approve
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
