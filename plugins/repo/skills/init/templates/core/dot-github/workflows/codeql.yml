name: codeql

# Standard tier and up, where CodeQL is free: public repositories, or private
# ones with GitHub Code Security (its license forbids it on other private
# code; references/areas/security.md). Advanced setup, so that each pull
# request gets a `CodeQL` check, which the main-human-gates ruleset requires:
# it fails on new alerts at or above the repository's threshold, compared with
# main, honors dismissed alerts, and a `neutral` result counts as passing. The
# bots' App is exempt from that ruleset, so dependency updates never wait on it.
#
# No `paths` filter: a required check that never reports blocks the merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "27 4 * * 3"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Keep `actions` (every repository has workflows, so the check always
        # reports) and the languages of the modules present.
        include:
          - language: actions
            build-mode: none
          - language: csharp
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
