name: renovate

# Runs Renovate over every repository the Renovate GitHub App is installed on.
# The App's key lives on the `renovate` environment, readable by this job only.
on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:
    inputs:
      log_level:
        description: Renovate log level
        type: choice
        options: [info, debug]
        default: info

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: renovate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: renovate
    permissions:
      contents: read
    env:
      # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
      RENOVATE_VERSION: 44.263.4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: renovatebot/github-action@v46
        with:
          configurationFile: config.js
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: ${{ env.RENOVATE_VERSION }}
        env:
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
