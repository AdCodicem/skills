# Pulumi jobs for ci.yml (references/iac/pulumi.md). Paste both jobs under `jobs:`,
# above `gate`, add `pulumi-test` and `pulumi-preview` to `gate.needs`, and replace
# each `# {{pulumi-toolchain-...}}` line with the steps of toolchains/<language>.yml.
# {{infra-dir}} is `infra` in an application repository, `.` in an operations repository.
jobs:
  pulumi-test:
    name: pulumi test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # {{pulumi-toolchain-setup}}
      # {{pulumi-toolchain-test}}

  # Runs on every event so that `gate` sees a success, but only a pull request
  # from a branch of this repository gets an OIDC token: on a fork's pull request
  # or a push, the steps below are skipped. The plan identity reads the cloud,
  # takes the state lock and decrypts the stack's secrets; it changes nothing.
  pulumi-preview:
    name: pulumi preview
    needs: pulumi-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      SAME_REPO_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
      # The Azure Native provider requests its own OIDC token (ARM_USE_OIDC).
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_PLAN_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Read-only Cloudflare token, a repository secret (fork pull requests never
      # receive it). Remove when the program has no Cloudflare resources.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PLAN_API_TOKEN }}
    steps:
      - name: Say why nothing runs
        if: env.SAME_REPO_PR != 'true'
        run: echo "pulumi preview runs only on pull requests from branches of this repository."

      - uses: actions/checkout@v7
        if: env.SAME_REPO_PR == 'true'
        with:
          persist-credentials: false

      # {{pulumi-toolchain-setup}} (add `if: env.SAME_REPO_PR == 'true'` to each step)

      # The state backend (azblob) and the Key Vault secrets provider authenticate
      # through the Azure CLI session this step opens.
      - uses: azure/login@v3
        if: env.SAME_REPO_PR == 'true'
        with:
          client-id: ${{ vars.AZURE_PLAN_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Summary only, never a pull request comment: on a public repository anyone
      # could read the plan of production.
      - uses: pulumi/actions@v7
        if: env.SAME_REPO_PR == 'true'
        with:
          command: preview
          stack-name: staging
          work-dir: "{{infra-dir}}"
          cloud-url: ${{ vars.PULUMI_BACKEND_URL }}
          pulumi-version-file: "{{infra-dir}}/.pulumi.version"
          comment-on-summary: true
          suppress-outputs: true

      - uses: pulumi/actions@v7
        if: env.SAME_REPO_PR == 'true'
        with:
          command: preview
          stack-name: production
          work-dir: "{{infra-dir}}"
          cloud-url: ${{ vars.PULUMI_BACKEND_URL }}
          pulumi-version-file: "{{infra-dir}}/.pulumi.version"
          comment-on-summary: true
          suppress-outputs: true
