name: stale

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          exempt-issue-labels: "pinned,security"
          exempt-pr-labels: "pinned,dependencies"
          exempt-all-milestones: true
          stale-issue-message: >
            This issue has had no activity for 60 days and will be closed in
            14 days. Comment to keep it open.
          stale-pr-message: >
            This pull request has had no activity for 60 days and will be
            closed in 14 days. Comment or push to keep it open.
