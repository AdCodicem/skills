# zizmor configuration (lint.yml runs zizmor on every pull request).
rules:
  # zizmor recommends GitHub's `$/` self-repository syntax (2026-07-30) over
  # `./.github/workflows/...`, but actionlint 1.7.12 rejects it. Re-enable this
  # audit, and switch to `$/`, once actionlint accepts it.
  self-repository:
    disable: true
  # ci.yml's `validate` job installs the Claude Code CLI with npm, outside a
  # lockfile: the version is exact and tracked by Renovate, and the job holds
  # no credential (contents: read, no secret). A package.json for one CLI
  # would add a Node project the repository does not have.
  adhoc-packages:
    ignore:
      - ci.yml
